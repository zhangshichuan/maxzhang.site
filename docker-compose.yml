services:
  migrate:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prisma
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL
    profiles:
      - migrate

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL
      - TTS_BASE_URL=http://tts:8001
      - CHAT_BASE_URL=http://chat:9000
    ports:
      - '3000:3000'
    depends_on:
      tts:
        condition: service_healthy
      chat:
        condition: service_healthy

  tts:
    build:
      context: ./apps/services/tts
      dockerfile: Dockerfile
    volumes:
      - tts_data:/data/tts
    environment:
      - TTS_CACHE_DIR=/data/tts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  chat:
    build:
      context: ./apps/services/chat
      dockerfile: Dockerfile
    environment:
      - DEEPSEEK_API_KEY
      - DEEPSEEK_MODEL=deepseek-v4-flash
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:9000/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# 数据持久化：SQLite 在 sqlite_data，TTS 音频缓存（30天/1GB 自动清理）在 tts_data
volumes:
  sqlite_data:
  tts_data:
