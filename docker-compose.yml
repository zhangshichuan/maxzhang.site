services:
  migrate:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prisma
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL
    profiles:
      - migrate

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL
      - TTS_BASE_URL=http://tts:8001
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - tts

  tts:
    build:
      context: ./apps/services/tts
      dockerfile: Dockerfile
    volumes:
      - tts_data:/data/tts
    environment:
      - TTS_CACHE_DIR=/data/tts

# 数据持久化：SQLite 在 sqlite_data，TTS 音频缓存（30天/1GB 自动清理）在 tts_data
volumes:
  sqlite_data:
  tts_data:
