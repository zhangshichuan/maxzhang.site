services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus 抓取 Collector 指标出口

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # Jaeger UI
    depends_on:
      - otel-collector

  prometheus:
    image: prom/prometheus:v3
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:13.0.6
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3333:3000"   # 本地 Web dev 占用 3000，Grafana 改用 3333
    depends_on:
      - jaeger
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
