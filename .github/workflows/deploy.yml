name: Deploy to maxzhang.site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Prepare deployment artifacts
        run: |
          mkdir -p deployment

          # 服务器上用 docker compose build 重新构建镜像，
          # 需要完整的仓库源码（TanStack 多阶段构建 + TTS 服务）
          cp -r apps deployment/apps
          # 去掉本地安装/构建产物：node_modules 符号链接、.output、.next 都不进 tar
          rm -rf deployment/apps/web/node_modules deployment/apps/web/.output deployment/apps/web/.next
          cp docker-compose.yml .dockerignore deployment/
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml deployment/

      - name: Archive production artifacts
        run: |
          cd deployment
          tar -czf ../release.tar.gz *

      - name: Upload release files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'release.tar.gz'
          target: ${{secrets.DEPLOY_PATH}}

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{secrets.DEPLOY_PATH}}
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

            # 清理旧的构建文件
            rm -rf apps docker-compose.yml .dockerignore package.json pnpm-lock.yaml pnpm-workspace.yaml

            # 解压新文件
            tar -xzf release.tar.gz
            rm release.tar.gz

            # 构建镜像
            docker compose build app
            docker compose build tts
            docker compose build migrate

            # 运行迁移
            docker compose run --rm migrate

            # 启动应用
            docker compose up -d

            # 清理无用的镜像
            docker image prune -f
