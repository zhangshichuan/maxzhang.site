name: Deploy to maxzhang.site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Prepare deployment artifacts
        run: |
          mkdir -p deployment

          # 复制 standalone 输出 (包含 server.js 和 必要的 node_modules)
          cp -r .next/standalone/. deployment/standalone

          # 复制静态资源 (standalone 模式不包含这两部分，需要手动复制)
          cp -r .next/static/. deployment/static
          cp -r public/. deployment/public

          # 复制 prisma 配置和 schema
          cp -r prisma/. deployment/prisma
          cp prisma.config.ts deployment

          # 复制 Dockerfile、docker-compose.yml 和 Prisma 需要的 package.json
          cp Dockerfile deployment/
          cp Dockerfile.prisma deployment/
          cp docker-compose.yml deployment/

      - name: Archive production artifacts
        run: |
          cd deployment
          tar -czf ../release.tar.gz *

      - name: Upload release files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'release.tar.gz'
          target: ${{secrets.DEPLOY_PATH}}

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{secrets.DEPLOY_PATH}}

            # 清理旧的构建文件
            rm -rf standalone static public prisma prisma.config.ts Dockerfile Dockerfile.prisma docker-compose.yml

            # 解压新文件
            tar -xzf release.tar.gz
            rm release.tar.gz

            # 停止并移除旧容器
            docker compose down

            # 清理所有构建缓存
            docker builder prune -f

            # 构建镜像
            docker compose build

            # 运行迁移（migrate 服务有 profiles: [migrate]，up -d 不会自动启动它）
            DATABASE_URL=${{ secrets.DATABASE_URL }} docker compose run --rm migrate

            # 启动应用
            DATABASE_URL=${{ secrets.DATABASE_URL }} docker compose up -d

            # 清理无用的镜像
            docker image prune -f
