name: Deploy to maxzhang.site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Prepare deployment artifacts
        run: |
          mkdir -p deployment/apps/web

          # 复制 standalone 输出
          cp -r apps/web/.next/standalone/. deployment/apps/web/standalone

          # 复制静态资源
          cp -r apps/web/.next/static/. deployment/apps/web/static
          cp -r apps/web/public/. deployment/apps/web/public

          # 复制 prisma 配置和 schema
          cp -r apps/web/prisma/. deployment/apps/web/prisma
          cp apps/web/prisma.config.ts deployment/apps/web

          # 复制 Dockerfile、docker-compose.yml
          cp apps/web/Dockerfile deployment/apps/web/
          cp apps/web/Dockerfile.prisma deployment/apps/web/
          cp docker-compose.yml deployment/

      - name: Archive production artifacts
        run: |
          cd deployment
          tar -czf ../release.tar.gz *

      - name: Upload release files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'release.tar.gz'
          target: ${{secrets.DEPLOY_PATH}}

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{secrets.DEPLOY_PATH}}
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

            # 清理旧的构建文件
            rm -rf apps docker-compose.yml

            # 解压新文件
            tar -xzf release.tar.gz
            rm release.tar.gz

            # 构建镜像
            docker compose build
            docker compose build --no-cache migrate

            # 运行迁移
            docker compose run --rm migrate

            # 启动应用
            docker compose up -d

            # 清理无用的镜像
            docker image prune -f
